name: Backend tests

on:
  push:
    paths:
      - 'cellix_backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'cellix_backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cellix_backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cellix_backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit + integration suite (Spec 01–08)
        env:
          NODE_ENV: test
          ENABLE_COMPLEXITY_TIERING: full
        run: >
          npx jest --runInBand --forceExit --coverage=false
          test/complexity-classifier.spec.ts
          test/complexity-tiering-flag.spec.ts
          test/llm-router-complexity.spec.ts
          test/tier0-direct.service.spec.ts
          test/tier1-single-action.service.spec.ts
          test/tier2-generate-verify.service.spec.ts
          test/conversation-tier-routing.spec.ts
          test/conversation.e2e.spec.ts
          test/mode-guard.util.spec.ts
          test/mode-plan-only.spec.ts
          test/mode-selector.e2e.spec.ts
          test/audit-sourcerefs.spec.ts
          test/audit-export.spec.ts
          test/orchestrator.e2e.spec.ts
          test/formula-validator.service.spec.ts
          src/domain-tools

      - name: Full test suite
        env:
          NODE_ENV: test
          ENABLE_COMPLEXITY_TIERING: full
        run: npm test -- --forceExit --coverage=false
